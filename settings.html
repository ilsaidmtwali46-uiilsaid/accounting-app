<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعدادات النظام والأمان</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <style>
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: #1e293b; color: white; padding: 10px 15px; border-radius: 8px; margin-bottom: 15px; }
        .sub-counter { font-weight: bold; color: #38bdf8; font-size: 14px; }
        .contact-btn { background: #25d366; color: white; padding: 6px 12px; border-radius: 5px; text-decoration: none; font-size: 13px; font-weight: bold; }
        .nav-menu-btn { background: #0284c7; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-size: 16px; }
        
        .dropdown-menu { display: none; position: absolute; top: 60px; right: 15px; background: white; border: 1px solid #ccc; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); z-index: 1000; width: 200px; }
        .dropdown-menu button { display: block; width: 100%; text-align: right; padding: 12px; border: none; background: none; border-bottom: 1px solid #eee; cursor: pointer; font-size: 15px; }
        .dropdown-menu button:last-child { border-bottom: none; }
        .dropdown-menu button:hover { background: #f1f5f9; }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="nav-menu-btn" onclick="toggleMenu()">☰ الشاشات</button>
        <div class="sub-counter" id="subscriptionCounter">⏳ جارِ التحقق من الاشتراك...</div>
        <a href="https://wa.me/201000000000" class="contact-btn" target="_blank">💬 للدعم والشكاوى</a>
    </div>

    <div class="dropdown-menu" id="navDropdown">
        <button onclick="accessPage('sales.html')">🛒 المبيعات</button>
        <button onclick="accessPage('purchases.html')">📦 المشتريات</button>
        <button onclick="accessPage('treasury.html')">💰 الخزينة</button>
        <button onclick="accessPage('stock.html')">📋 الجرد والمخزن</button>
        <button onclick="accessPage('suppliers.html')">👥 الموردين</button>
        <button onclick="accessPage('settings.html')">⚙️ الإعدادات</button>
    </div>

    <div class="container">
        <h2>⚙️ إعدادات النظام وأمان البيانات</h2>

        <div class="card">
            <h3>🔒 حماية النظام برقم سري</h3>
            <label>كلمة السر الحالية:</label>
            <input type="password" id="currentPass" placeholder="تترك فارغة إذا لم تكن مفعلة">
            
            <label>كلمة السر الجديدة:</label>
            <input type="password" id="newPass" placeholder="أدخل كلمة سر جديدة">
            
            <button class="btn btn-blue" onclick="savePassword()">🔑 حفظ كلمة السر</button>
            <button class="btn btn-red" onclick="disablePassword()">🔓 إلغاء كلمة السر</button>
        </div>

        <div class="card">
            <h3>💾 النسخ الاحتياطي واستعادة البيانات</h3>
            <p style="font-size: 12px; color: #666;">يتم حفظ نسخة احتياطية تلقائياً داخل جهازك لحماية البيانات من الضياع.</p>
            
            <button class="btn btn-green" onclick="exportBackup()">📥 تصدير نسخة احتياطية للموبايل</button>
            
            <hr>
            
            <label>استرجاع نسخة احتياطية من ملف:</label>
            <input type="file" id="backupFile" accept=".json">
            <button class="btn btn-orange" onclick="importBackup()">📤 استرجاع البيانات من الملف</button>
        </div>
    </div>

    <script src="db.js"></script>
    <script>
        function toggleMenu() {
            const menu = document.getElementById('navDropdown');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        function accessPage(pageUrl) {
            const savedPass = localStorage.getItem('app_password');
            if (savedPass) {
                const userPass = prompt("🔐 أدخل الرقم السري لصاحب النشاط للدخول:");
                if (userPass === savedPass) {
                    window.location.href = pageUrl;
                } else {
                    alert("❌ الرقم السري غير صحيح!");
                }
            } else {
                window.location.href = pageUrl;
            }
        }

        function updateSubCounter() {
            const expireDate = localStorage.getItem('app_expire_date');
            if (expireDate) {
                const now = new Date().getTime();
                const diff = new Date(expireDate).getTime() - now;
                const days = Math.ceil(diff / (1000 * 60 * 60 * 24));
                
                if (days > 0) {
                    document.getElementById('subscriptionCounter').innerText = `⏳ باقي ${days} يوم على الاشتراك`;
                } else {
                    document.getElementById('subscriptionCounter').innerText = `❌ انتهى الاشتراك`;
                }
            }
        }

        window.onload = updateSubCounter;
    </script>
</body>
</html>

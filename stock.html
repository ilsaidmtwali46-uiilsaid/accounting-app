<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جرد المخزن بالنواقص</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 15px; background-color: #f8f9fa; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #fff; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background: #17a2b8; color: white; }
        .low-stock { background-color: #f8d7da; color: #721c24; font-weight: bold; }
        a { text-decoration: none; color: #007bff; font-weight: bold; display: inline-block; margin-bottom: 10px; }
    </style>
</head>
<body>

    <a href="index.html">🏠 العودة للرئيسية</a>
    <h2>📦 جرد المخزن الموحد وقائمة النواقص</h2>

    <table>
        <thead>
            <tr>
                <th>الصنف الأساسي</th>
                <th>النوع / الماركة</th>
                <th>الحجم / المواصفة</th>
                <th>الكمية المتاحة</th>
                <th>سعر الشراء</th>
                <th>سعر البيع</th>
                <th>الحالة</th>
            </tr>
        </thead>
        <tbody id="stockTableBody"></tbody>
    </table>

    <script src="auth.js"></script>
    <script src="inventory.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (checkScreenAccess("stock", "الجرد والمخزن")) {
                renderStockTable();
            }
        });

        function renderStockTable() {
            const stock = getStockData();
            const tbody = document.getElementById('stockTableBody');
            tbody.innerHTML = '';

            if (stock.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7">لا توجد أصناف في المخزن حالياً</td></tr>';
                return;
            }

            stock.forEach(item => {
                const isLow = item.quantity <= (item.minLimit || 5);
                const tr = document.createElement('tr');
                if (isLow) tr.className = 'low-stock';

                tr.innerHTML = `
                    <td>${item.category}</td>
                    <td>${item.type}</td>
                    <td>${item.size}</td>
                    <td>${item.quantity}</td>
                    <td>${item.buyPrice} ج.م</td>
                    <td>${item.sellPrice} ج.م</td>
                    <td>${isLow ? '⚠️ نواقص (طلب شراء)' : '✅ متوفر'}</td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
